# Exemplo/schema de curriculo/perfil.yaml (sem dados pessoais).
# O arquivo real (curriculo/perfil.yaml) fica fora do git — veja .gitignore.
# Copie este arquivo para perfil.yaml e preencha com dados reais.

dados_pessoais:
  nome: ""
  email: ""
  telefone: ""
  site: ""
  linkedin: ""
  github: ""
  localizacao: ""

titulo: "" # headline do LinkedIn, opcional

resumo: ""

experiencias:
  - empresa: ""
    local: ""
    cargo: ""
    periodo: ""
    contexto: "" # uma linha sobre o que a empresa/projeto faz, opcional
    stack: [] # competências listadas no item do LinkedIn, opcional
    bullets:
      - ""

formacao:
  - instituicao: ""
    local: ""
    curso: ""
    periodo: ""

certificacoes: [] # texto simples, ex.: "Emissor – Nome (carga horária ou mmm/AAAA)"

skills:
  tecnicas: []
  comportamentais: []

idiomas: []

projetos:
  - nome: ""
    descricao: "" # uma linha: o que é o projeto
    link: "" # repositório
    site: "" # deploy/demo, opcional
    periodo: ""
    stack: []
    destaques:
      - ""
    fontes: [] # de onde veio: linkedin, github e/ou manual (ver docs/mescla-perfil.md)
