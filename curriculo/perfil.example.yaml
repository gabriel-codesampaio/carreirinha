# Exemplo/schema de curriculo/perfil.yaml (sem dados pessoais).
# O arquivo real (curriculo/perfil.yaml) fica fora do git — veja .gitignore.
# Copie este arquivo para perfil.yaml e preencha com dados reais.

# Opcional: idioma em que este arquivo é mantido (ex.: "pt-BR"). As importações traduzem fielmente para ele.
idioma_base: ""

dados_pessoais:
  nome: ""
  email: ""
  telefone: ""
  site: ""
  linkedin: ""
  github: ""
  localizacao: ""

titulo: "" # headline do LinkedIn, opcional

resumo: ""

experiencias:
  - empresa: ""
    local: ""
    cargo: ""
    periodo: ""
    contexto: "" # uma linha sobre o que a empresa/projeto faz, opcional
    stack: [] # competências listadas no item do LinkedIn, opcional
    bullets:
      - ""

formacao:
  - instituicao: ""
    local: ""
    curso: ""
    periodo: ""

certificacoes: [] # texto simples, ex.: "Emissor – Nome (carga horária ou mmm/AAAA)"

skills:
  tecnicas: []
  comportamentais: []

idiomas: []

projetos:
  - nome: ""
    descricao: "" # uma linha: o que é o projeto
    link: "" # repositório
    site: "" # deploy/demo, opcional
    periodo: ""
    stack: []
    destaques:
      - ""
    fontes: [] # de onde veio: linkedin, github e/ou manual (ver docs/mescla-perfil.md)

# Opcional: decisões suas que valem por cima das regras padrão da gerar-curriculo.
# Exemplo: título do currículo conforme a senioridade da vaga.
regras_alternativas: []
#  - nome: "Título conforme a senioridade da vaga"
#    aplica_a: ["Título do currículo (linha abaixo do nome)"]
#    regra:
#      - vaga: "Sênior"
#        usar: "Desenvolvedor Front-End Sênior"
#      - vaga: "Júnior / Pleno"
#        usar: "Desenvolvedor Front-End"
